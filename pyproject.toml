[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "destiny-calendar-animation"
version = "0.1.0"
description = "Turn video clips into pixel-art animation manifests for calendar experiments."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "google-api-python-client>=2.149",
  "google-auth>=2.35",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "tzdata>=2025.2; platform_system == 'Windows'",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6", "types-PyYAML>=6.0"]

[project.scripts]
calendar-anim = "calendar_anim.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_anim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "unit: fast tests isolated from filesystem, video codecs, and the CLI",
  "integration: tests that combine components through files, OpenCV, or the CLI",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["calendar_anim"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["cv2.*", "google_auth_oauthlib.*", "googleapiclient.*"]
ignore_missing_imports = true
